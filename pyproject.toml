[project]
name = "meal-planner"
version = "0.1.0"
description = "Scrapes Gousto recipes into a local database and helps you find recipes from ingredients you already have."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "selenium>=4.6",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
meal-planner-scrape = "meal_planner.scraper:main"
meal-planner-serve = "meal_planner.webapp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meal_planner*"]

[tool.setuptools.package-data]
meal_planner = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]