[project]
name = "meal-planner"
version = "0.1.0"
description = "Scrapes Gousto recipes into a local database and helps you find recipes from ingredients you already have."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "selenium>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"